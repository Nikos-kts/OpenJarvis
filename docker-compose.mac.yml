# macOS setup: Jarvis in Docker, Ollama native on host (Metal GPU)
# Usage: docker compose -f docker-compose.mac.yml up -d

services:
  jarvis:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.openjarvis/docker-config.toml:/root/.openjarvis/config.toml:ro
      - openjarvis-data:/root/.openjarvis/data
    environment:
      - OPENJARVIS_ENGINE_DEFAULT=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: ["serve", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openjarvis-data: