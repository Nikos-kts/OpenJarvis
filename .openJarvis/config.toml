# =============================================================================
# Speech — STT / voice input
# =============================================================================
# [speech]
# backend = "auto"                     # auto | faster-whisper | openai | deepgram
# model = "base"                       # tiny | base | small | medium | large-v3
# language = ""                        # "" = auto-detect
# device = "auto"                      # auto | cpu | cuda
# compute_type = "float16"             # float16 | int8 | float32


# =============================================================================
# Sessions — cross-channel conversation memory
# =============================================================================
# [sessions]
# enabled = false
# max_age_hours = 24.0
# consolidation_threshold = 100
# db_path = ".openJarvis/db/sessions.db"


# =============================================================================
# Scheduler — cron-style jobs
# =============================================================================
# [scheduler]
# enabled = false
# poll_interval = 60
# db_path = ""                         # defaults to .openJarvis/db/scheduler.db


# =============================================================================
# Workflow — multi-step graph runner
# =============================================================================
# [workflow]
# enabled = false
# max_parallel = 4
# default_node_timeout = 300


# =============================================================================
# Sandbox — containerised code execution
# =============================================================================
# [sandbox]
# enabled = false
# image = "openjarvis-sandbox:latest"
# runtime = "docker"                   # docker | podman | wasm
# timeout = 300
# max_concurrent = 5
# workspace = ""
# mount_allowlist_path = ""
# wasm_fuel_limit = 1000000
# wasm_memory_limit_mb = 256


# =============================================================================
# Agent manager — persistent, user-authored agents
# =============================================================================
# [agent_manager]
# enabled = true
# db_path = ".openJarvis/db/agents.db"


# =============================================================================
# Memory files — long-lived context (SOUL / MEMORY / USER)
# =============================================================================
# [memory_files]
# soul_path = ".openJarvis/SOUL.md"
# memory_path = ".openJarvis/MEMORY.md"
# user_path = ".openJarvis/USER.md"
# nudge_interval = 10


# =============================================================================
# System prompt — assembly limits
# =============================================================================
# [system_prompt]
# soul_max_chars = 4000
# memory_max_chars = 2500
# user_max_chars = 1500
# skill_desc_max_chars = 60
# truncation_strategy = "head_tail"    # head_tail | head | tail


# =============================================================================
# Compression — context window management
# =============================================================================
# [compression]
# enabled = true
# threshold = 0.50                     # fraction of context window before compressing
# strategy = "session_consolidation"


# =============================================================================
# Skills — procedural skills authored by agents
# =============================================================================
# [skills]
# enabled = true
# skills_dir = ".openJarvis/skills/"
# active = "*"                         # "*" = all; otherwise comma-separated names
# auto_discover = true
# auto_sync = false
# nudge_interval = 15
# index_repo = "https://github.com/openjarvis/skill-index.git"
# index_dir = ".openJarvis/skill-index/"
# max_depth = 5
# sandbox_dangerous = true
# sources = []                         # list of { source = "hermes|openclaw|github", url = "…" }


