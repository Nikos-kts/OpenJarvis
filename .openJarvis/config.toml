# OpenJarvis configuration
# Hardware: Apple M3 Pro (11 cores, 18.0 GB RAM) — GPU: Apple M3 Pro (18.0 GB unified)
#
# Every key below is shown with its built-in default. Uncomment a line to
# override it. Lines prefixed with `# ` are the defaults; lines without a
# leading `#` are active overrides.
#
# You can also edit everything from the Settings page in the OpenJarvis UI —
# writes there go through the same validator and preserve these comments.


# =============================================================================
# Engine — which local inference runtime(s) to talk to
# =============================================================================
[engine]
default = "mlx"                     # ollama | vllm | sglang | llamacpp | mlx | lmstudio | exo | nexa | uzu | apple_fm | gemmacpp | lemonade

[engine.ollama]
# host = "http://localhost:11434"      # set to remote URL if engine runs elsewhere

# [engine.vllm]
# host = "http://localhost:8000"

# [engine.sglang]
# host = "http://localhost:30000"

# [engine.llamacpp]
# host = "http://localhost:8080"
# binary_path = ""                     # path to a local llama.cpp binary

# [engine.mlx]
# host = "http://localhost:8080"

# [engine.lmstudio]
# host = "http://localhost:1234"

# [engine.exo]
# host = "http://localhost:52415"

# [engine.nexa]
# host = "http://localhost:18181"
# device = ""                          # cpu | gpu | npu

# [engine.uzu]
# host = "http://localhost:8080"

# [engine.apple_fm]
# host = "http://localhost:8079"

# [engine.gemmacpp]
# host = "http://localhost:8080"
# binary_path = ""

# [engine.lemonade]
# host = "http://localhost:8000"


# =============================================================================
# Intelligence — model identity and generation defaults
# =============================================================================
host = ""

[engine.vllm]
host = "http://localhost:8000"

[engine.sglang]
host = "http://localhost:30000"

[engine.llamacpp]
host = "http://localhost:8080"
binary_path = ""

[engine.mlx]
host = "http://localhost:8080"

[engine.lmstudio]
host = "http://localhost:1234"

[engine.exo]
host = "http://localhost:52415"

[engine.nexa]
host = "http://localhost:18181"
device = ""

[engine.uzu]
host = "http://localhost:8000"

[engine.apple_fm]
host = "http://localhost:8079"

[engine.gemma_cpp]
model_path = ""
tokenizer_path = ""
model_type = ""
num_threads = 0

[engine.lemonade]
host = "http://localhost:8000"
[intelligence]
default_model = "qwen2.5:7b"           # recommended for this hardware
# fallback_model = ""                  # used when the default is unreachable
# model_path = ""                      # local weights (HF repo, GGUF file, …)
# checkpoint_path = ""                 # checkpoint / adapter path
# quantization = "none"                # none | fp8 | int8 | int4 | gguf_q4 | gguf_q8
# preferred_engine = ""                # force a specific engine for this model
# provider = ""                        # local | openai | anthropic | google
# temperature = 0.7
# max_tokens = 1024
# top_p = 0.9
# top_k = 40
# repetition_penalty = 1.0
# stop_sequences = ""                  # comma-separated stop strings


# =============================================================================
# Agent — harness, tools, system prompt
# =============================================================================
[agent]
default_agent = "orchestrator"               # built-in: simple | orchestrator | react | plan_execute …
# max_turns = 10
# tools = ""                           # comma-separated tool names (per-agent override)
# objective = ""                       # concise purpose string (routing + docs)
# system_prompt = ""                   # inline system prompt (takes precedence)
# system_prompt_path = ""              # or load from a .txt / .md file
# context_from_memory = true           # inject relevant memory chunks into prompts


# =============================================================================
# Tools — memory backend, MCP, browser, default tool set
# =============================================================================
[tools]
enabled = ["code_interpreter", "web_search", "file_read", "shell_exec"]  # default tool set

[tools.storage]
# default_backend = "sqlite"           # sqlite | chroma | qdrant | …
# db_path = ".openJarvis/db/memory.db"
# context_top_k = 5
# context_min_score = 0.1
# context_max_tokens = 2048
# chunk_size = 512
# chunk_overlap = 64

[tools.mcp]
# enabled = true
# servers = ""                         # JSON list of MCP server configs

# [tools.browser]
# headless = true
# timeout_ms = 30000
# viewport_width = 1280
# viewport_height = 720


# =============================================================================
# Server — HTTP API
# =============================================================================
[server]
# host = "127.0.0.1"                   # use "0.0.0.0" to expose on the network
# port = 8000
# agent = "orchestrator"               # default agent served on /v1/chat/completions
# model = ""                           # default model (empty = intelligence.default_model)
# workers = 1
# cors_origins = [
#     "http://localhost:3000",
#     "http://localhost:5173",
#     "http://127.0.0.1:3000",
#     "http://127.0.0.1:5173",
#     "tauri://localhost",
# ]


# =============================================================================
# Security — guardrails, rate limiting, audit log
# =============================================================================
[security]
# enabled = true
# profile = ""                         # "" | personal | shared | server (preset overlays)
# mode = "redact"                      # redact | warn | block
# scan_input = true
# scan_output = true
# secret_scanner = true
# pii_scanner = true
# enforce_tool_confirmation = true
# ssrf_protection = true
# merkle_audit = true
# signing_key_path = ""
# audit_log_path = ".openJarvis/db/audit.db"
# vault_key_path = ".openJarvis/.vault_key"
# rate_limit_enabled = true
# rate_limit_rpm = 60
# rate_limit_burst = 10
# local_engine_bypass = false          # skip scanning for calls to local engines
# local_tool_bypass = false            # skip scanning for fully local tools

# [security.capabilities]
# enabled = false
# policy_path = ""                     # RBAC / capability policy file


# =============================================================================
# Telemetry — persisted run metrics
# =============================================================================
[telemetry]
enabled = false
# db_path = ".openJarvis/db/telemetry.db"
# gpu_metrics = false
# gpu_poll_interval_ms = 50
# energy_vendor = ""                   # auto | nvidia | amd | apple | cpu_rapl
# warmup_samples = 0
# steady_state_window = 5
# steady_state_threshold = 0.05


# =============================================================================
# Traces — full request/response logs
# =============================================================================
# [traces]
# enabled = true
# db_path = ".openJarvis/db/traces.db"


