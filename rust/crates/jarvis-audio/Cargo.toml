[package]
name = "jarvis-audio"
version = "0.1.0"
edition = "2021"
description = "Standalone audio daemon for OpenJarvis: mic capture, VAD, playback, WebSocket server."

[[bin]]
name = "jarvis-audio"
path = "src/main.rs"

[dependencies]
# Async runtime + WebSocket transport.
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures = { workspace = true }

# Audio hardware access.
cpal = "0.15"

# Cross-thread hand-off between the cpal sync callback and the async runtime.
crossbeam-channel = "0.5"

# CLI + config.
clap = { version = "4.5", features = ["derive"] }

# Logging.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors + ser/de for the JSON control protocol.
anyhow = "1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Byte buffers for binary WS frames.
bytes = "1"
